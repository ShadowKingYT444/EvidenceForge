services:
  - type: web
    name: evidenceforge-demo
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: "commit"
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: EVIDENCE_MODE
        value: live
      - key: RUN_TOKEN_SECRET
        generateValue: true
      - key: RUN_CACHE_TTL_MINUTES
        value: 120
      - key: RESEARCH_SESSION_TTL_MINUTES
        value: 120
      - key: FINAL_RUN_RETENTION_MINUTES
        value: 15
      - key: OWNER_DEMO_SECRET
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: PRIMARY_PROVIDER
        value: groq
      - key: PRIMARY_MODEL
        value: openai/gpt-oss-20b
      - key: REVIEW_PROVIDER
        value: nvidia_nim
      - key: REVIEW_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: OPENALEX_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
      - key: UNPAYWALL_EMAIL
        sync: false
