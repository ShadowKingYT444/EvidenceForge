services:
  - type: web
    name: evidenceforge-demo
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm db:migrate && corepack pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: EVIDENCE_MODE
        value: live
      - key: DATABASE_URL
        fromDatabase:
          name: evidenceforge-db
          property: connectionString
      - key: RUN_TOKEN_SECRET
        generateValue: true
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
      - key: UNPAYWALL_EMAIL
        sync: false
databases:
  - name: evidenceforge-db
    plan: free
